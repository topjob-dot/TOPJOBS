<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard – TOPJOBSEEKERS</title>
<link rel="stylesheet" href="style.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
  body { background: var(--blue-pale); }
  .dash-header { background: var(--navy); color: #fff; position: sticky; top: 0; z-index: 900; padding: 10px 0; box-shadow: 0 2px 14px rgba(0,0,0,.18); }
  .dash-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .dash-brand { display: flex; align-items: center; gap: 8px; color: #fff; min-width: 0; }
  .dash-brand .logo-icon { font-size: 22px; color: var(--gold); }
  .dash-brand strong { font-family: var(--font-display, 'Sora', sans-serif); font-size: 16px; letter-spacing: .3px; white-space: nowrap; }
  .dash-role-pill { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; background: rgba(245,166,35,0.18); color: var(--gold); padding: 4px 10px; border-radius: 100px; white-space: nowrap; }
  .dash-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .dash-act { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 100px; font: 600 13px var(--font, inherit); color: #fff; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); cursor: pointer; }
  .dash-act:hover { background: rgba(255,255,255,.2); }
  .dash-act-out { background: var(--gold); border-color: var(--gold); color: #24463F; }
  .dash-act-out:hover { background: #f0b556; }
  .dash-header .xt-btn { width: 38px; height: 38px; background: rgba(255,255,255,.1); color: #fff; border-color: rgba(255,255,255,.25); }
  @media (max-width: 560px) {
    .dash-brand strong { font-size: 14px; }
    .dash-act { width: 38px; padding: 0; } .dash-act span { display: none; }
    .dash-header .xt-panel { position: fixed; left: 12px; right: 12px; top: 62px; width: auto; }
  }
  .dash-brand { overflow: hidden; }
  @media (max-width: 520px) { .dash-role-pill { display: none; } }
  .dash-body { padding: 40px 0 80px; }
  .dash-card { background: #fff; border-radius: var(--radius-lg); padding: 28px; box-shadow: var(--shadow); margin-bottom: 24px; }
  .dash-card h3 { color: var(--navy); margin-bottom: 16px; font-size: 18px; }
  table.dash-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.dash-table th, table.dash-table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  table.dash-table th { color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  .status-pill { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 100px; text-transform: capitalize; }
  .status-new { background: var(--blue-light); color: var(--blue); }
  .status-reviewed { background: #fff3e0; color: #b8720b; }
  .status-shortlisted { background: #e6f7f1; color: #0a7c4e; }
  .status-placed { background: #0a7c4e; color: #fff; }
  .status-rejected { background: #fdeceb; color: #b3261e; }
  .small-btn { font-size: 12px; padding: 6px 12px; border-radius: 8px; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
  .pending-banner { background: #fff3e0; color: #b8720b; padding: 16px 20px; border-radius: 10px; font-weight: 600; margin-bottom: 24px; }
</style>
<link rel="stylesheet" href="extras.css" />
<script src="extras.js"></script>
</head>
<body>
<div id="pageLoader" aria-hidden="true"><div class="ld-ring"></div><div class="ld-brand">TOPJOB<span>SEEKERS</span></div></div>

  <header class="dash-header">
    <div class="container dash-bar">
      <a href="index.html" class="dash-brand" aria-label="TOPJOBSEEKERS home">
        <span class="logo-icon"><i class="fas fa-globe-africa"></i></span>
        <strong>TOPJOBSEEKERS</strong>
        <span class="dash-role-pill" id="rolePill">...</span>
      </a>
      <div class="dash-actions">
        <a href="index.html" class="dash-act" aria-label="Back to site"><i class="fas fa-house"></i><span>Site</span></a>
        <button type="button" class="dash-act dash-act-out" id="logoutBtn" aria-label="Log out"><i class="fas fa-right-from-bracket"></i><span>Log out</span></button>
      </div>
    </div>
  </header>

  <div class="container dash-body" id="dashBody">
    <div class="empty-state"><i class="fas fa-spinner fa-spin"></i> Loading your dashboard...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
